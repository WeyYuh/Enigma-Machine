<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enigma Machine Simulator</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="manual-btn-container">
        <a href="manual.html" id="manual-link" class="manual-btn">📖 Manual</a>
    </div>


    <div class="keyboard">
        <div class="row">
            <div class="rotor" id="rotor-1">
                <div class="highlight"></div>
            </div>
            <div class="rotor" id="rotor-2">
                <div class="highlight"></div>
            </div>
            <div class="rotor" id="rotor-3">
                <div class="highlight"></div>
            </div>
        </div>

        <div class="row">
            <div class="light-dim" id="light-q">Q</div>
            <div class="light-dim" id="light-w">W</div>
            <div class="light-dim" id="light-e">E</div>
            <div class="light-dim" id="light-r">R</div>
            <div class="light-dim" id="light-t">T</div>
            <div class="light-dim" id="light-z">Z</div>
            <div class="light-dim" id="light-u">U</div>
            <div class="light-dim" id="light-i">I</div>
            <div class="light-dim" id="light-o">O</div>
        </div>

        <div class="row">

            <div class="light-dim" id="light-a">A</div>
            <div class="light-dim" id="light-s">S</div>
            <div class="light-dim" id="light-d">D</div>
            <div class="light-dim" id="light-f">F</div>
            <div class="light-dim" id="light-g">G</div>
            <div class="light-dim" id="light-h">H</div>
            <div class="light-dim" id="light-j">J</div>
            <div class="light-dim" id="light-k">K</div>
        </div>

        <div class="row">
            <div class="light-dim" id="light-p">P</div>
            <div class="light-dim" id="light-y">Y</div>
            <div class="light-dim" id="light-x">X</div>
            <div class="light-dim" id="light-c">C</div>
            <div class="light-dim" id="light-v">V</div>
            <div class="light-dim" id="light-b">B</div>
            <div class="light-dim" id="light-n">N</div>
            <div class="light-dim" id="light-m">M</div>
            <div class="light-dim" id="light-l">L</div>
        </div>

        <div class="row">
            <div class="key">Q</div>
            <div class="key">W</div>
            <div class="key">E</div>
            <div class="key">R</div>
            <div class="key">T</div>
            <div class="key">Z</div>
            <div class="key">U</div>
            <div class="key">I</div>
            <div class="key">O</div>
        </div>

        <div class="row">

            <div class="key">A</div>
            <div class="key">S</div>
            <div class="key">D</div>
            <div class="key">F</div>
            <div class="key">G</div>
            <div class="key">H</div>
            <div class="key">J</div>
            <div class="key">K</div>
        </div>

        <div class="row">
            <div class="key">P</div>
            <div class="key">Y</div>
            <div class="key">X</div>
            <div class="key">C</div>
            <div class="key">V</div>
            <div class="key">B</div>
            <div class="key">N</div>
            <div class="key">M</div>
            <div class="key">L</div>
        </div>

        <div class="plugboard">
            <div class="plugboard-row">
                <div class="pair" data-label="Q"></div>
                <div class="pair" data-label="W"></div>
                <div class="pair" data-label="E"></div>
                <div class="pair" data-label="R"></div>
                <div class="pair" data-label="T"></div>
                <div class="pair" data-label="Z"></div>
                <div class="pair" data-label="U"></div>
                <div class="pair" data-label="I"></div>
                <div class="pair" data-label="O"></div>
            </div>

            <div class="plugboard-row">
                <div class="pair" data-label="A"></div>
                <div class="pair" data-label="S"></div>
                <div class="pair" data-label="D"></div>
                <div class="pair" data-label="F"></div>
                <div class="pair" data-label="G"></div>
                <div class="pair" data-label="H"></div>
                <div class="pair" data-label="J"></div>
                <div class="pair" data-label="K"></div>
            </div>

            <div class="plugboard-row">
                <div class="pair" data-label="P"></div>
                <div class="pair" data-label="Y"></div>
                <div class="pair" data-label="X"></div>
                <div class="pair" data-label="C"></div>
                <div class="pair" data-label="V"></div>
                <div class="pair" data-label="B"></div>
                <div class="pair" data-label="N"></div>
                <div class="pair" data-label="M"></div>
                <div class="pair" data-label="L"></div>
            </div>
        </div>
        
    </div>

    <div class="content">
        <div class="container">
            <div class="label">Input</div>
            <div id="input" class="text-box"></div>
        </div>
    
        <div class="container">
            <div class="label">Output</div>
            <div id="output" class="text-box"></div>
        </div>
    </div>

    <div class="content">
        <button type="button" class="control-button" id="clear-btn">Clear</button>
        <button type="button" class="control-button" id="steps-btn">Show steps</button>
    </div>

    <div id="steps-section" style="display: none;">
        <h2>Encryption steps</h2>
        <p class="hint-text" id="steps">Encryption steps will appear here...</p>
        <div id="viz" style="display: none"></div>
    </div>
    

    <script src="script.js" defer></script>
</body>
</html>
