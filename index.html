<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enigma Machine Simulator</title>
    <style>
        .keyboard {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 80vw;
            margin: 20px auto;
            padding: 20px;
            background: #333;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .row {
            display: flex;
            justify-content: center;  /* center the keys horizontally */
            gap: 10px;
        }

        .key {
    background: #eee;
    padding: 15px 20px;
    text-align: center;
    font-size: 24px;
    font-family: monospace;
    border-radius: 5px;
    cursor: pointer;
    user-select: none;
    transition: 0.1s;
}

.key:active {
    background: #ccc;
    transform: translateY(2px);
}

        .content {
            display: flex;
            gap: 20px;
            padding: 20px;
            box-sizing: border-box;
            width: 100%;
        }

        .container {
            flex: 1;                  /* half of available width */
            display: flex;            /* make flex column */
            flex-direction: column;   /* label on top, box below */
            height: 50vh;             /* adjust as desired */
            box-sizing: border-box;
            min-width: 0;             /* prevents overflow */
        }

        .label {
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: bold;
            flex-shrink: 0;           /* label keeps its height */
        }

        .text-box {
            border: 2px solid black;
            padding: 20px;
            font-size: 32px;
            background: #f5f5f5;
            box-sizing: border-box;

            word-wrap: break-word;
            overflow-y: auto;
            overflow-x: hidden;

            flex: 1;                  /* takes remaining vertical space */
        }
    </style>
</head>
<body>
    <div class="keyboard">
        <div class="row">

            <div class="key">Q</div>
            <div class="key">W</div>
            <div class="key">E</div>
            <div class="key">R</div>
            <div class="key">T</div>
            <div class="key">Z</div>
            <div class="key">U</div>
            <div class="key">I</div>
            <div class="key">O</div>
        </div>

        <div class="row">

            <div class="key">A</div>
            <div class="key">S</div>
            <div class="key">D</div>
            <div class="key">F</div>
            <div class="key">G</div>
            <div class="key">H</div>
            <div class="key">J</div>
            <div class="key">K</div>
        </div>

        <div class="row">

            <div class="key">P</div>
            <div class="key">Y</div>
            <div class="key">X</div>
            <div class="key">C</div>
            <div class="key">V</div>
            <div class="key">B</div>
            <div class="key">N</div>
            <div class="key">M</div>
            <div class="key">L</div>
        </div>
    </div>

    <div class="content">
        <div class="container">
            <div class="label">Input</div>
            <div id="input" class="text-box"></div>
        </div>
    
        <div class="container">
            <div class="label">Output</div>
            <div id="output" class="text-box"></div>
        </div>
    </div>

    <script>
        const url = "http://localhost"
        const port = 5000

        const keys = document.querySelectorAll(".key");
        keys.forEach(key => {
            key.addEventListener('click', async () => {
                const letter = key.textContent;
                document.getElementById("input").textContent += letter;

                const encrypted = await sendToEnigmaPy(letter);
                document.getElementById("output").textContent += encrypted;
            });
        });

        document.addEventListener("keydown", async function (e) {
            if (e.key.length === 1 && e.key.match(/[a-zA-Z]/)) {
                const letter = e.key.toUpperCase();
                document.getElementById("input").textContent += letter;

                const encrypted = await sendToEnigmaPy(letter);

                document.getElementById("output").textContent += encrypted;
            }
        });

        async function sendToEnigmaPy(letter) {
            const res = await fetch(`${url}:${port}/encrypt`, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({char: letter})
            });

            const data = await res.json();
            return data.cipher;
        }
    </script>
</body>
</html>
