<!DOCTYPE html>
<html>
<head>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            margin: 20px;
            font-family: Arial, sans-serif;
        }
        
        .container {
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 8px;
            background: #f9f9f9;
        }
        
        .node-rect {
            fill: #e3f2fd;
            stroke: #1976d2;
            stroke-width: 2;
            rx: 8;
            ry: 8;
        }
        
        .node-circle {
            stroke: #fff;
            stroke-width: 2;
            cursor: pointer;
            transition: r 0.2s;
        }
        
        .node-circle:hover {
            r: 12;
        }
        
        .node-label {
            font-size: 12px;
            fill: #333;
            text-anchor: middle;
            pointer-events: none;
            user-select: none;
        }
        
        .connector {
            stroke: #666;
            stroke-width: 1.5;
            stroke-dasharray: 5,5;
            fill: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h3>Rectangle with Circle Nodes</h3>
        <div id="viz"></div>
    </div>

    <script>
        // Sample data for nodes
        const nodes = [
            { id: 1, x: 100, y: 100, label: "Start", color: "#4CAF50" },
            { id: 2, x: 250, y: 100, label: "Process", color: "#2196F3" },
            { id: 3, x: 150, y: 200, label: "Decision", color: "#FF9800" },
            { id: 4, x: 300, y: 200, label: "End", color: "#F44336" },
            { id: 5, x: 200, y: 300, label: "Node 5", color: "#9C27B0" }
        ];
        
        const links = [
            { source: 1, target: 2 },
            { source: 2, target: 3 },
            { source: 3, target: 4 },
            { source: 3, target: 5 }
        ];
        
        const width = 600;
        const height = 400;
        
        const svg = d3.select("#viz")
            .append("svg")
            .attr("width", width)
            .attr("height", height)
            .attr("viewBox", `0 0 ${width} ${height}`);
        
        // Create rectangle container
        const container = svg.append("g")
            .attr("class", "node-container")
            .attr("transform", "translate(50, 50)");
        
        // Draw bounding rectangle
        const rectWidth = 500;
        const rectHeight = 300;
        
        container.append("rect")
            .attr("class", "node-rect")
            .attr("width", rectWidth)
            .attr("height", rectHeight)
            .attr("fill", "#f5f5f5")
            .attr("stroke", "#ccc")
            .attr("stroke-width", 2)
            .attr("rx", 10)
            .attr("ry", 10);
        
        // Add title to rectangle
        container.append("text")
            .attr("x", rectWidth / 2)
            .attr("y", 25)
            .attr("text-anchor", "middle")
            .attr("font-size", "16px")
            .attr("font-weight", "bold")
            .attr("fill", "#333")
            .text("Node Container");
        
        // Create circle nodes
        const nodeGroup = container.append("g")
            .attr("class", "nodes");
        
        const circles = nodeGroup.selectAll("circle")
            .data(nodes)
            .enter()
            .append("g")
            .attr("class", "node-group")
            .attr("transform", d => `translate(${d.x}, ${d.y})`);
        
        // Draw circles
        circles.append("circle")
            .attr("class", "node-circle")
            .attr("r", 10)
            .attr("fill", d => d.color)
            .on("mouseover", function(event, d) {
                d3.select(this)
                    .transition()
                    .duration(200)
                    .attr("r", 15);
                
                // Show tooltip
                tooltip.style("opacity", 1)
                    .html(`<strong>${d.label}</strong><br>ID: ${d.id}`);
            })
            .on("mouseout", function() {
                d3.select(this)
                    .transition()
                    .duration(200)
                    .attr("r", 10);
                
                tooltip.style("opacity", 0);
            })
            .on("click", function(event, d) {
                console.log("Clicked node:", d);
                d3.select(this)
                    .transition()
                    .attr("fill", "#333");
            })
            .call(d3.drag()
                .on("start", dragStarted)
                .on("drag", dragged)
                .on("end", dragEnded));
        
        // Add labels
        circles.append("text")
            .attr("class", "node-label")
            .attr("y", 25)
            .attr("text-anchor", "middle")
            .text(d => d.label);
        
        // Draw connections between nodes
        const linkGroup = container.append("g")
            .attr("class", "links");
        
        links.forEach(link => {
            const sourceNode = nodes.find(n => n.id === link.source);
            const targetNode = nodes.find(n => n.id === link.target);
            
            if (sourceNode && targetNode) {
                linkGroup.append("line")
                    .attr("class", "connector")
                    .attr("x1", sourceNode.x)
                    .attr("y1", sourceNode.y)
                    .attr("x2", targetNode.x)
                    .attr("y2", targetNode.y);
            }
        });
        
        // Add tooltip
        const tooltip = d3.select("body")
            .append("div")
            .attr("class", "tooltip")
            .style("position", "absolute")
            .style("background", "white")
            .style("padding", "8px")
            .style("border", "1px solid #ddd")
            .style("border-radius", "4px")
            .style("opacity", 0)
            .style("pointer-events", "none")
            .style("font-size", "12px");
        
        // Drag functions
        function dragStarted(event, d) {
            d3.select(this).raise();
        }
        
        function dragged(event, d) {
            d.x = event.x;
            d.y = event.y;
            d3.select(this.parentNode)
                .attr("transform", `translate(${d.x}, ${d.y})`);
            
            // Update connections
            updateConnections();
        }
        
        function dragEnded(event, d) {
            // Check if node is inside container
            if (d.x < 0 || d.x > rectWidth || d.y < 0 || d.y > rectHeight) {
                d.x = Math.max(10, Math.min(rectWidth - 10, d.x));
                d.y = Math.max(10, Math.min(rectHeight - 10, d.y));
                d3.select(this.parentNode)
                    .attr("transform", `translate(${d.x}, ${d.y})`);
            }
        }
        
        function updateConnections() {
            linkGroup.selectAll("line").each(function(link, i) {
                const sourceNode = nodes.find(n => n.id === links[i].source);
                const targetNode = nodes.find(n => n.id === links[i].target);
                
                if (sourceNode && targetNode) {
                    d3.select(this)
                        .attr("x1", sourceNode.x)
                        .attr("y1", sourceNode.y)
                        .attr("x2", targetNode.x)
                        .attr("y2", targetNode.y);
                }
            });
        }
    </script>
</body>
</html>
